name: Refresh npm download statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '18 11 * * *'
  push:
    branches: [main]
    paths: ['.github/scripts/refresh-downloads.mjs', '.github/workflows/downloads.yml', 'registry/**', 'skills/**', 'src/installer.js']
permissions:
  contents: write
concurrency:
  group: npm-statistics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/refresh-downloads.mjs
      - name: Save verified public statistics
        run: |
          git config user.name 'theihtishaam'
          git config user.email '59793939+theihtishaam@users.noreply.github.com'
          git add assets/downloads.svg assets/project-stats.svg docs/npm-downloads.json docs/catalog-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public npm download statistics'
          git push

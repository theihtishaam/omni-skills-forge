<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="232" viewBox="0 0 1280 232" role="img" aria-labelledby="title desc">
  <title id="title">Find, inspect and copy a skill</title>
  <desc id="desc">Search the full registry with osf search. Inspect a matching skill with osf info. Copy Markdown to an explicit directory with osf install.</desc>
  <defs><linearGradient id="base" x2="1" y2="1"><stop stop-color="#14213a"/><stop offset="1" stop-color="#0b1426"/></linearGradient></defs>
  <rect x=".75" y=".75" width="1278.5" height="230.5" rx="15" fill="url(#base)" stroke="#3c5270" stroke-width="1.5"/>
  <path d="M66 56h1148" stroke="#79a6ca" stroke-opacity=".45" stroke-width="2"/>
  <g fill="#9be3ff" stroke="#172a46" stroke-width="4"><circle cx="66" cy="56" r="10"/><circle cx="477" cy="56" r="10"/><circle cx="888" cy="56" r="10"/></g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g fill="#f6f8ff" font-size="35" font-weight="720"><text x="56" y="115">Find a skill</text><text x="467" y="115">Inspect the source</text><text x="878" y="115">Copy to a directory</text></g>
    <g fill="#bed1e7" font-size="24"><text x="56" y="153">Search the full registry</text><text x="467" y="153">Check the path and difficulty</text><text x="878" y="153">Choose the target and path</text></g>
    <g fill="#f7cb86" font-family="Consolas,monospace" font-size="23" font-weight="650"><text x="56" y="191">osf search</text><text x="467" y="191">osf info</text><text x="878" y="191">osf install --dir</text></g>
  </g>
</svg>
